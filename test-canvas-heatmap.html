<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Canvas Heatmap Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.5/heatmap.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .test-section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .canvas-container { position: relative; width: 800px; height: 600px; margin: 20px 0; border: 2px solid #333; }
        canvas { display: block; }
        .info { background: #f0f0f0; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 12px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>🧪 Canvas Heatmap.js Integration Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Canvas with Background Image</h2>
        <div class="canvas-container">
            <canvas id="testCanvas1" style="position: relative; display: block; width: 100%; background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22800%22 height=%22600%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22800%22 height=%22600%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-size=%2224%22 fill=%22%23999%22%3EBackground Image (SVG)%3C/text%3E%3C/svg%3E'); background-size: contain; background-repeat: no-repeat;"></canvas>
        </div>
        <div id="status1" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Heatmap.js Instance Creation</h2>
        <div id="status2" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Data Rendering</h2>
        <div id="status3" class="status"></div>
    </div>

    <script>
        console.log('=== Canvas Heatmap Test Start ===');
        
        // Test 1: Canvas setup with background image
        console.log('\n📋 Test 1: Canvas with background image');
        const canvas1 = document.getElementById('testCanvas1');
        console.log('Canvas element:', canvas1);
        console.log('Canvas tagName:', canvas1.tagName);
        console.log('Canvas dimensions before:', canvas1.width, 'x', canvas1.height);
        
        const container1 = canvas1.parentElement;
        canvas1.width = container1.offsetWidth;
        canvas1.height = container1.offsetHeight;
        
        console.log('Canvas dimensions after:', canvas1.width, 'x', canvas1.height);
        console.log('Canvas style.position:', canvas1.style.position);
        console.log('Canvas computed background-image:', window.getComputedStyle(canvas1).backgroundImage);
        
        document.getElementById('status1').innerHTML = `
            <strong>✓ Canvas Created</strong>
            <div class="info">
                - Canvas element found: ${canvas1 ? 'YES' : 'NO'}<br>
                - Canvas size: ${canvas1.width}x${canvas1.height}<br>
                - Background image applied: ${window.getComputedStyle(canvas1).backgroundImage.length > 0 ? 'YES' : 'NO'}<br>
                - 2D Context available: ${canvas1.getContext('2d') ? 'YES' : 'NO'}
            </div>
        `;
        
        // Test 2: Heatmap.js instance
        console.log('\n📋 Test 2: Heatmap.js instance');
        if (typeof h337 === 'undefined') {
            console.error('❌ heatmap.js library not loaded!');
            document.getElementById('status2').innerHTML = '<strong class="error">✗ Error: heatmap.js not loaded</strong>';
        } else {
            console.log('✓ heatmap.js library loaded');
            try {
                const heatmapInstance = h337.create({
                    container: canvas1,
                    radius: 40,
                    maxOpacity: 0.85,
                    minOpacity: 0.05,
                    blur: 0.85,
                    gradient: {
                        '.0': 'blue',
                        '.25': 'cyan',
                        '.50': 'yellow',
                        '.75': 'orange',
                        '1.0': 'red'
                    }
                });
                console.log('✓ Heatmap instance created:', heatmapInstance);
                
                document.getElementById('status2').innerHTML = `
                    <strong class="success">✓ Heatmap Instance Created</strong>
                    <div class="info">
                        - Instance: ${heatmapInstance ? 'valid' : 'invalid'}<br>
                        - setData method: ${heatmapInstance && typeof heatmapInstance.setData === 'function' ? 'available' : 'missing'}
                    </div>
                `;
                
                // Test 3: Data rendering
                console.log('\n📋 Test 3: Data rendering');
                const testData = {
                    max: 100,
                    data: [
                        { x: 100, y: 100, value: 80 },
                        { x: 200, y: 150, value: 60 },
                        { x: 300, y: 250, value: 40 },
                        { x: 400, y: 200, value: 90 },
                        { x: 500, y: 300, value: 30 },
                        { x: 600, y: 350, value: 70 },
                        { x: 700, y: 150, value: 50 }
                    ]
                };
                
                console.log('Setting heatmap data:', testData);
                heatmapInstance.setData(testData);
                console.log('✓ Data set successfully');
                
                document.getElementById('status3').innerHTML = `
                    <strong class="success">✓ Heatmap Rendered</strong>
                    <div class="info">
                        - Data points: ${testData.data.length}<br>
                        - Max value: ${testData.max}<br>
                        - Heatmap should now be visible above (check visually)
                    </div>
                `;
                
            } catch (e) {
                console.error('❌ Error creating/rendering heatmap:', e);
                document.getElementById('status2').innerHTML = `<strong class="error">✗ Error: ${e.message}</strong>`;
                document.getElementById('status3').innerHTML = `<strong class="error">✗ Error: Could not render data</strong>`;
            }
        }
        
        console.log('\n=== Canvas Heatmap Test Complete ===');
    </script>
</body>
</html>
