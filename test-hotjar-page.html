<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotjar Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }
        .button:hover {
            background: #764ba2;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Hotjar Tracker Test Page</h1>
        <p>This page tests the screenshot capture functionality.</p>
        
        <div>
            <button class="button" onclick="testClick()">Test Click</button>
            <button class="button" onclick="checkStatus()">Check Screenshot Status</button>
        </div>
        
        <div class="status" id="status">
            Status: Waiting for tracker to initialize...
        </div>
    </div>

    <!-- Hotjar Tracker -->
    <script src="/js/hotjar-tracker.js"></script>
    <script>
        // Initialize tracker for website_id 8
        const tracker = new HotjarTracker(8);
        
        function testClick() {
            document.getElementById('status').innerHTML = 'Button clicked! Check move heatmap data.';
        }
        
        function checkStatus() {
            // Check if screenshot API endpoint exists
            fetch('/api/heatmap/screenshot?website_id=8&page_path=/test-hotjar-page.html', {
                credentials: 'same-origin',
                headers: {
                    'Accept': 'application/json',
                    'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.content || ''
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.screenshot_path) {
                    document.getElementById('status').innerHTML = 
                        'Screenshot saved! URL: ' + data.screenshot_path + 
                        '<br><img src="' + data.screenshot_path + '" style="max-width:300px;margin-top:10px;">';
                } else {
                    document.getElementById('status').innerHTML = 'No screenshot found. The tracker will auto-capture on load.';
                }
            })
            .catch(error => {
                document.getElementById('status').innerHTML = 'Error checking screenshot: ' + error.message;
            });
        }
        
        // Auto-check status after 3 seconds (to allow time for screenshot capture)
        setTimeout(checkStatus, 3000);
    </script>
</body>
</html>
